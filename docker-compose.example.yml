# 示例：与现有 Docker 服务（postgres-server / minio-server / milvus-standalone）对齐。
# 复制为 docker-compose.yml 并配合根目录 .env（勿提交 .env）使用。
#
#   cp docker-compose.example.yml docker-compose.yml
#   cp .env.example .env   # 填入真实密码
#   docker compose up -d

services:
  postgres-server:
    image: postgres:15-alpine
    container_name: postgres-server
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-onemini}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - onemini-net

  minio-server:
    image: minio/minio
    container_name: minio-server
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
    volumes:
      - minio_data:/data
    networks:
      - onemini-net

  # Milvus / Attu 请沿用你现有的 compose 或独立容器；此处仅示意网络名
  # milvus-standalone:
  #   image: milvusdb/milvus:v2.4-latest
  #   ...

volumes:
  postgres_data:
  minio_data:

networks:
  onemini-net:
    name: milvus-network
